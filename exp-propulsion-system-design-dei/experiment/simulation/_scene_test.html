<style>
  html,body{margin:0;padding:0;background:#0a1016;overflow:hidden}
  #stage{position:relative}
  canvas{display:block}
  #ov{position:absolute;inset:0;pointer-events:none;
      font-family:"Helvetica Neue",Arial,sans-serif;color:#f2f7fa}
  /* cinematic vignette — darkens the edges, focuses the subject */
  #vig{position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(ellipse 75% 75% at 50% 48%,
         rgba(0,0,0,0) 42%, rgba(0,0,0,.45) 78%, rgba(0,0,0,.72) 100%)}
  .title{position:absolute;left:0;right:0;top:34%;text-align:center;opacity:0}
  .title h1{margin:0;font-size:5.6vw;font-weight:800;letter-spacing:.5px;color:#fff;
            text-shadow:0 3px 24px rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,.9)}
  .title .rule{width:190px;height:4px;margin:16px auto 12px;border-radius:2px;
               background:#5adcec;box-shadow:0 0 18px rgba(90,220,236,.7)}
  .title p{margin:0;font-size:1.9vw;color:#cfe0ea;letter-spacing:3px;
           text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.9)}
  .label{position:absolute;left:6%;bottom:11%;opacity:0;
         background:rgba(6,10,14,.92);border-left:6px solid #5adcec;
         border-radius:12px;padding:15px 30px;
         box-shadow:0 10px 34px rgba(0,0,0,.6)}
  .label span{font-size:2.5vw;font-weight:800;color:#fff;
              text-shadow:0 2px 8px rgba(0,0,0,.8)}
  .table{position:absolute;right:5%;top:14%;width:30%;opacity:0;
         background:rgba(6,10,14,.93);border:1px solid rgba(90,220,236,.18);
         border-radius:14px;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.7)}
  .table h2{margin:0;padding:14px 20px;font-size:1.6vw;font-weight:800;color:#5adcec;
            background:rgba(14,24,32,.96);border-bottom:1px solid rgba(90,220,236,.22)}
  .table table{width:100%;border-collapse:collapse;font-size:1.2vw}
  .table td{padding:9px 20px}
  .table td.k{color:#aebecb}
  .table td.v{text-align:right;font-weight:800;color:#fff}
  .table tr:nth-child(even){background:rgba(255,255,255,.04)}

<body>
<div id="stage">

<script>
// ───────── config (Playwright injects window.__CFG; fall back to defaults) ─────────
const CFG = window.__CFG || {
  assetsBase: "assets",
  chassis:"fpv5", motor:"2310", propeller:"5in_tri", esc:"Cyclone_35A",
  controller:"PiHawk", receiver:"CM703", battery:"4s_1500",
  attachments:["gps","camera"], focus:["motor","esc","battery"],
  title:"Propulsion System", subtitle:"Concept Explanation",
  width:1280, height:720, duration:60, fps:30, exposure:0.85
};
const W = CFG.width, H = CFG.height, DURATION = CFG.duration;
const BASE = CFG.assetsBase || "assets";

// ───────── renderer / scene / studio look ─────────
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W, H); renderer.setPixelRatio(1);

if(renderer.physicallyCorrectLights !== undefined) renderer.physicallyCorrectLights = true;
document.getElementById("stage").appendChild(renderer.domElement);

const scene = new THREE.Scene();
// dark radial studio backdrop
(function(){
  const c=document.createElement("canvas"); c.width=c.height=512; const cx=c.getContext("2d");
  const g=cx.createRadialGradient(256,236,20, 256,256,400);
  g.addColorStop(0,"#0c1922"); g.addColorStop(.4,"#070f16"); g.addColorStop(1,"#010306");
  cx.fillStyle=g; cx.fillRect(0,0,512,512);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; scene.background=t;
})();
// custom DARK studio environment for realistic-but-moody reflections:
// a near-black surround with a few soft light panels (softboxes) baked to IBL.
const pmrem = new THREE.PMREMGenerator(renderer);
function studioEnv(){
  const s=new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.SphereGeometry(12,32,16),
        new THREE.MeshBasicMaterial({side:THREE.BackSide,color:0x05090d})));
  const panel=(x,y,z,w,h,intensity,col)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
      new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(intensity)}));
    m.position.set(x,y,z); m.lookAt(0,0,0); s.add(m);
  };
  panel(5,7,4, 9,9, 2.2, 0xfff1e2);    // warm key softbox
  panel(-6,4,-4, 8,8, 1.0, 0x9ec6ff);   // cool fill
  panel(0,6,-7, 12,5, 1.1, 0x5fd6ff);   // cyan rim strip
  panel(0,-4,0, 16,16, 0.12, 0x0a1016); // faint floor bounce
  return s;
}
scene.environment = pmrem.fromScene(studioEnv(), 0.03).texture;

const camera = new THREE.PerspectiveCamera(40, W/H, 0.01, 100);

// key + rim + fill (key casts a soft shadow)
const key = new THREE.DirectionalLight(0xffe4c4, 2.1);   // warm key (teal-orange: orange side)
key.position.set(3,5,2); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.bias = -0.0004;
key.shadow.camera.near=0.1; key.shadow.camera.far=30;
key.shadow.camera.left=-3; key.shadow.camera.right=3;
key.shadow.camera.top=3; key.shadow.camera.bottom=-3;
scene.add(key);
const rim = new THREE.DirectionalLight(0x4bd0e2, 1.45); rim.position.set(-3,2.5,-4); scene.add(rim); // teal rim (teal side)
scene.add(new THREE.HemisphereLight(0x7fb4d8, 0x140f0a, 0.12));

// dark glossy studio floor (subtle reflection)
const floor = new THREE.Mesh(new THREE.CircleGeometry(60, 64),
  new THREE.MeshStandardMaterial({color:0x03060a, roughness:0.78, metalness:0.0}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

// cinematic bloom on highlights
const composer = new THREE.EffectComposer(renderer);
composer.setSize(W, H);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(W, H), 0.42, 0.5, 0.85);
composer.addPass(bloom);

// ══════════════ ASSEMBLY (ported verbatim from simulation/js/main.js §6) ══════════════
let propGroups = [];
let rigParts = { motors: [], escs: [], battery: null };
const ANCH = {};                         // mount type -> [anchor] for camera focus
const FX = { setEmitter: function(){} }; // particle FX not needed for the film
let __pending = 0;                       // outstanding model loads (for ready gate)

function mat(color, opts){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:.55, metalness:.35}, opts||{})); }
function buildFallback(spec){
  const T = THREE, g = new T.Group();
  const c = spec.color, s = spec.s || 1;
  const add = (geo, m, x,y,z, rx,ry,rz)=>{ const mesh=new T.Mesh(geo,m); mesh.position.set(x||0,y||0,z||0); mesh.rotation.set(rx||0,ry||0,rz||0); g.add(mesh); return mesh; };
  switch(spec.kind){
    case "frame":
      add(new T.BoxGeometry(.85,.07,.85), mat(c));
      add(new T.BoxGeometry(.62,.05,.62), mat(0x39424b), 0,.09,0);
      for(let i=0;i<4;i++){ const a=Math.PI/4+i*Math.PI/2;
        add(new T.BoxGeometry(1.5,.055,.11), mat(c), Math.cos(a)*.72,0,Math.sin(a)*.72, 0,-a,0);
        add(new T.CylinderGeometry(.11,.13,.1,20), mat(0x1f3a93), Math.cos(a)*1.4,.06,Math.sin(a)*1.4); }
      break;
    case "prop":
      add(new T.CylinderGeometry(.09,.09,.12,16), mat(0x22262b));
      for(let i=0;i<2;i++) add(new T.BoxGeometry(1.7,.02,.18), mat(c), 0,.03,0, 0,i*Math.PI,.12); break;
    case "motor":
      add(new T.CylinderGeometry(.42,.42,.5,28), mat(c));
      add(new T.CylinderGeometry(.46,.46,.1,28), mat(0x22262b), 0,.3,0);
      add(new T.CylinderGeometry(.07,.07,.35,12), mat(0xb9c2c9), 0,.55,0);
      add(new T.CylinderGeometry(.45,.45,.08,28), mat(0x22262b), 0,-.28,0);
      for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; add(new T.BoxGeometry(.05,.42,.1), mat(0x33393f), Math.cos(a)*.43,0,Math.sin(a)*.43, 0,-a,0); } break;
    case "esc":
      add(new T.BoxGeometry(1.1,.22,.55), mat(c));
      add(new T.BoxGeometry(1.12,.06,.57), mat(0x22262b), 0,.14,0);
      add(new T.CylinderGeometry(.045,.045,.5,8), mat(0xc23b2e), -.62,0,.1, 0,0,Math.PI/2);
      add(new T.CylinderGeometry(.045,.045,.5,8), mat(0x22262b), -.62,0,-.1, 0,0,Math.PI/2); break;
    case "battery":
      add(new T.BoxGeometry(1.35,.5,.65), mat(c,{roughness:.4}));
      add(new T.BoxGeometry(.28,.54,.69), mat(0xd8b93c), -.2,0,0);
      add(new T.BoxGeometry(.2,.3,.5), mat(0x22262b), .78,0,0); break;
    case "fc":
      add(new T.BoxGeometry(.9,.07,.9), mat(0x1f4d3f));
      add(new T.BoxGeometry(.34,.12,.34), mat(c), 0,.09,0);
      for(let i=0;i<4;i++) add(new T.CylinderGeometry(.035,.035,.1,8), mat(0xd8b93c), (i%2?.38:-.38),.05,(i<2?.38:-.38)); break;
    case "rx":
      add(new T.BoxGeometry(.6,.18,.4), mat(c));
      add(new T.CylinderGeometry(.02,.02,.8,8), mat(0x22262b), .18,.48,0, .35,0,0);
      add(new T.CylinderGeometry(.02,.02,.8,8), mat(0x22262b), -.18,.48,0, -.35,0,0); break;
    case "gimbal":
      add(new T.TorusGeometry(.42,.05,12,30), mat(0x33393f), 0,0,0, Math.PI/2);
      add(new T.BoxGeometry(.5,.4,.42), mat(c), 0,-.1,0);
      add(new T.CylinderGeometry(.14,.16,.2,20), mat(0x111417), 0,-.1,.3, Math.PI/2);
      add(new T.CylinderGeometry(.1,.1,.04,20), mat(0x4f6d9e), 0,-.1,.42, Math.PI/2); break;
    default: add(new T.SphereGeometry(.4,18,14), mat(0xb8c4bf,{transparent:true,opacity:.35}));
  }
  g.scale.setScalar(s*.9); return g;
}
const modelCache = {}; let dracoLoader = null;
function draco(){ if(!dracoLoader && THREE.DRACOLoader){ dracoLoader = new THREE.DRACOLoader(); dracoLoader.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.4.1/"); } return dracoLoader; }
function brightenModel(obj){
  obj.traverse(o => { if(!o.isMesh || !o.material) return;
    o.castShadow = true; o.receiveShadow = true;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m => {
      if(!m || m.userData.__brightened) return; m.userData.__brightened = true;
      if(m.color) m.color.lerp(new THREE.Color(0xffffff), 0.09);
      if(m.emissive){ m.emissive.copy(m.color||new THREE.Color(0x222222)).multiplyScalar(0.05); m.emissiveIntensity=1; }
      if(m.metalness!=null) m.metalness=Math.min(m.metalness,0.5);
      if(m.roughness!=null) m.roughness=Math.min(m.roughness+0.05,1);
      m.needsUpdate=true; }); });
  return obj;
}
function loadModelFile(url){
  if(modelCache[url]) return modelCache[url];
  __pending++;
  modelCache[url] = new Promise((resolve,reject)=>{
    const lower = url.toLowerCase();
    if(lower.endsWith(".fbx")){ if(!THREE.FBXLoader) return reject(new Error("FBXLoader")); new THREE.FBXLoader().load(url, o=>resolve(brightenModel(o)), undefined, reject); }
    else { const loader=new THREE.GLTFLoader(); const dl=draco(); if(dl) loader.setDRACOLoader(dl); loader.load(url, g=>resolve(brightenModel(g.scene)), undefined, reject); }
  }).then(v=>{ __pending--; return v; }).catch(e=>{ __pending--; throw e; });
  return modelCache[url];
}
const ORIENT = { chasis:"flat", propeller:"flat", esc:"flat", battery:"flat", controller:"flat", reciever:"flat", motor:"axis", attachments:"none" };
function autoOrient(obj, rule){
  if(!rule || rule==="none") return;
  const s = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
  const dims=[s.x,s.y,s.z]; let axis;
  if(rule==="flat"){ axis=dims.indexOf(Math.min(...dims)); }
  else{ const med=[...dims].sort((a,b)=>a-b)[1]; const dev=dims.map(d=>Math.abs(d-med)); axis=dev.indexOf(Math.max(...dev)); }
  if(axis===0) obj.rotation.z=Math.PI/2; else if(axis===2) obj.rotation.x=-Math.PI/2;
}
function vertexCentroidXZ(root){
  root.updateMatrixWorld(true); let x=0,z=0,n=0; const v=new THREE.Vector3();
  root.traverse(m=>{ if(!(m.isMesh&&m.geometry&&m.geometry.attributes&&m.geometry.attributes.position)) return;
    const p=m.geometry.attributes.position; const step=Math.max(1,Math.floor(p.count/2000));
    for(let i=0;i<p.count;i+=step){ v.fromBufferAttribute(p,i); m.localToWorld(v); x+=v.x; z+=v.z; n++; } });
  return n?{x:x/n,z:z/n}:null;
}
function fitUnit(obj, span, o, orientOverride){
  const pre=new THREE.Group(); pre.add(obj);
  if(o){ if(orientOverride){ autoOrient(pre, orientOverride); }
    else if(o.view && Array.isArray(o.view.rotate_deg)){ const r=o.view.rotate_deg; pre.rotation.set(r[0]*Math.PI/180,r[1]*Math.PI/180,r[2]*Math.PI/180); }
    else autoOrient(pre, ORIENT[o.catKey]||"none"); }
  const outer=new THREE.Group(); outer.add(pre);
  const box=new THREE.Box3().setFromObject(outer); const size=box.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z)||1; const c=box.getCenter(new THREE.Vector3());
  if(o && (o.catKey==="propeller"||o.catKey==="motor")){ const hub=vertexCentroidXZ(outer); if(hub){ c.x=hub.x; c.z=hub.z; } }
  pre.position.sub(c); outer.scale.setScalar((span||1.6)/maxDim); outer.userData.spanScale=(span||1.6)/maxDim;
  return outer;
}
function orientMotorCombo(combo, parts){
  if(!parts||parts.length<2) return false;
  const cen=p=>new THREE.Box3().setFromObject(p).getCenter(new THREE.Vector3());
  const sep=cen(parts[parts.length-1]).sub(cen(parts[0]));
  if(sep.length()<=1e-6) return false;
  const a=[Math.abs(sep.x),Math.abs(sep.y),Math.abs(sep.z)]; const ax=a.indexOf(Math.max(a[0],a[1],a[2]));
  const from=new THREE.Vector3(ax===0?Math.sign(sep.x):0, ax===1?Math.sign(sep.y):0, ax===2?Math.sign(sep.z):0);
  combo.quaternion.setFromUnitVectors(from, new THREE.Vector3(0,1,0)); combo.updateMatrixWorld(true); return true;
}
function seatModel(g, mode){
  if(g.parent) g.parent.updateWorldMatrix(true,false);
  const b=new THREE.Box3().setFromObject(g); if(b.isEmpty()) return;
  const c=g.getWorldPosition(new THREE.Vector3());
  const s=(g.parent?g.parent.getWorldScale(new THREE.Vector3()).y:1)||1;
  if(mode==="hang") g.position.y-=(b.max.y-c.y)/s; else g.position.y+=(c.y-b.min.y)/s;
}
function modelFor(o, span, onReady){
  span=span||1.6; const g=new THREE.Group();
  const fb=buildFallback((o&&o.fallback)||{kind:"none",color:0xcccccc,s:1}); g.add(fitUnit(fb,span,null));
  if(o&&o.files&&o.files.length){
    Promise.all(o.files.map(loadModelFile)).then(masters=>{
      const merged=new THREE.Group(); const parts=masters.map(m=>m.clone(true)); parts.forEach(p=>merged.add(p));
      const oriented=o.catKey==="motor"&&orientMotorCombo(merged,parts);
      const fitted=fitUnit(merged,span,o,oriented?"none":undefined);
      while(g.children.length) g.remove(g.children[0]); g.add(fitted); if(onReady) onReady(g);
    }).catch(err=>console.warn("model load failed", o&&o.id, err.message||err));
  }
  return g;
}
const MOUNT_CATEGORY = { motor:"motor", esc:"esc", flight_controller:"controller", receiver:"reciever", battery:"battery" };
function orientThinUp(g){ const s=new THREE.Box3().setFromObject(g).getSize(new THREE.Vector3()); const d=[s.x,s.y,s.z], thin=d.indexOf(Math.min(d[0],d[1],d[2])); if(thin===0) g.rotation.z=Math.PI/2; else if(thin===2) g.rotation.x=-Math.PI/2; }
function orientCameraForward(g, tiltDeg){ const t=(tiltDeg==null?18:tiltDeg)*Math.PI/180; g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(Math.cos(t),Math.sin(t),0)); }
function rotorBellTopY(rotor){
  rotor.updateWorldMatrix(true,true); const box=new THREE.Box3().setFromObject(rotor);
  const cx=(box.min.x+box.max.x)/2, cz=(box.min.z+box.max.z)/2;
  const maxR=Math.max(box.max.x-box.min.x, box.max.z-box.min.z)/2||1; const thr=0.4*maxR, v=new THREE.Vector3();
  let topY=-Infinity;
  rotor.traverse(m=>{ if(!(m.isMesh&&m.geometry&&m.geometry.attributes&&m.geometry.attributes.position)) return;
    const p=m.geometry.attributes.position; const step=Math.max(1,Math.floor(p.count/4000));
    for(let i=0;i<p.count;i+=step){ v.fromBufferAttribute(p,i); m.localToWorld(v); if(Math.hypot(v.x-cx,v.z-cz)>thr && v.y>topY) topY=v.y; } });
  return isFinite(topY)?topY:box.max.y;
}
function mountMotor(anchor, o, spanM, spinDir, propInfo){
  const placeholder=fitUnit(buildFallback({kind:"motor",color:0x5a6672,s:1}),spanM,null); anchor.add(placeholder); seatModel(placeholder,"base");
  Promise.all(o.files.map(loadModelFile)).then(masters=>{
    let n=anchor; while(n&&n!==scene) n=n.parent; if(n!==scene) return;
    const combo=new THREE.Group(); const parts=masters.map(mm=>mm.clone(true)); parts.forEach(p=>combo.add(p));
    const twoPart=orientMotorCombo(combo,parts); let rotor=parts[parts.length-1];
    const fitted=fitUnit(combo,spanM,o,twoPart?"none":undefined);
    if(placeholder.parent) anchor.remove(placeholder); anchor.add(fitted); anchor.updateMatrixWorld(true,true);
    seatModel(fitted,"base"); anchor.updateMatrixWorld(true,true);
    const spinner=new THREE.Group(); spinner.userData.spinDir=spinDir; anchor.add(spinner);
    if(rotor) spinner.attach(rotor); propGroups.push(spinner);
    if(propInfo&&propInfo.opt){
      const prop=modelFor(propInfo.opt, propInfo.span, g=>{
        if(g.parent) g.parent.updateWorldMatrix(true,true);
        const bellTop=rotorBellTopY(rotor||spinner); const pb=new THREE.Box3().setFromObject(g);
        const s=(g.parent?g.parent.getWorldScale(new THREE.Vector3()).y:1)||1;
        g.position.y+=(bellTop-pb.min.y)/s - propInfo.span*0.02; });
      spinner.add(prop);
    }
  }).catch(err=>console.warn("motor load failed", err&&(err.message||err)));
}
function escIs4in1(o){ if(!o) return false; if(o.phys&&o.phys.form_factor==="4in1") return true; if((o.qty||4)<=1) return true; return /4.?in.?1/i.test((o.id||"")+" "+(o.name||"")); }

function buildDroneFromMounts(d, ch, sel, pr, attachOpts){
  const allMounts = ch.mounts.mounts || [];
  const wb = (ch.phys && ch.phys.wheelbase_mm) || 290;
  const u = 3.0/wb;
  const chMaxMm = Math.max.apply(null, ch.size || [265.7,60.1,212]);
  const chSpan = chMaxMm*u;
  const maxmm = o => (o&&o.size)?Math.max.apply(null,o.size):40;
  const mountPos = m => m.position || m.center || [0,0,0];
  function deriveUpAxis(){
    if(ch.phys && ch.phys.native_up) return ch.phys.native_up;
    const mo=allMounts.filter(m=>m.type==="motor"&&Array.isArray(m.normal));
    if(mo.length){ const s=[0,0,0]; mo.forEach(m=>{ for(let i=0;i<3;i++) s[i]+=Math.abs(m.normal[i]||0); });
      const ax=s.indexOf(Math.max.apply(null,s)); return ax===1?"y":ax===2?"z":"x"; } return null; }
  function upQuat(up){ const q=new THREE.Quaternion(); if(up==="z") q.setFromEuler(new THREE.Euler(-Math.PI/2,0,0)); else if(up==="x") q.setFromEuler(new THREE.Euler(0,0,Math.PI/2)); return q; }
  let upAxis = deriveUpAxis();
  const esc4in1 = escIs4in1(sel.esc);
  const chCon=new THREE.Group(); const inner=new THREE.Group(); chCon.add(inner); chCon.visible=false; d.add(chCon);
  function tag(type, anchor){ (ANCH[type]=ANCH[type]||[]).push(anchor); }
  function placeMounts(q, maxDim){
    const spanFor = mm => Math.max(mm,1)/chMaxMm*maxDim;
    const rot = raw => new THREE.Vector3(raw[0],raw[1],raw[2]).applyQuaternion(q);
    const yawQuat = deg => new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),(deg||0)*Math.PI/180);
    let motorCount=0; const escMounts=[];
    allMounts.forEach(m=>{
      const cat=MOUNT_CATEGORY[m.type];
      if(m.type==="esc"){ escMounts.push(m); return; }
      if(!cat) return;
      const o=sel[cat]; if(!o||!(o.files&&o.files.length)) return;
      const anchor=new THREE.Group(); anchor.position.copy(rot(mountPos(m))); anchor.quaternion.copy(yawQuat(m.rotation)); inner.add(anchor); tag(m.type, anchor);
      if(m.type==="motor"){
        const dir=(motorCount%2)?1:-1; const propMm=((pr&&pr.phys&&pr.phys.diameter_in)||5)*25.4;
        const propInfo=(pr&&pr.files&&pr.files.length)?{opt:pr,span:spanFor(propMm)}:null;
        mountMotor(anchor,o,spanFor(maxmm(o)),dir,propInfo); rigParts.motors.push(anchor); FX.setEmitter("motor"+motorCount,anchor,"motor"); motorCount++;
      }else{ anchor.add(modelFor(o,spanFor(maxmm(o)),g=>seatModel(g,"base"))); if(m.type==="battery"){ rigParts.battery=anchor; } }
    });
    if(sel.esc&&sel.esc.files&&sel.esc.files.length&&escMounts.length){
      const want=esc4in1?"4in1":"single"; let chosen=escMounts.filter(m=>(m.esc_type||"single")===want); if(!chosen.length) chosen=escMounts; if(esc4in1) chosen=chosen.slice(0,1);
      chosen.forEach((m,i)=>{ const anchor=new THREE.Group(); const p=rot(mountPos(m)); anchor.position.copy(p);
        if(esc4in1) anchor.quaternion.copy(yawQuat(m.rotation)); else anchor.rotation.y=-Math.atan2(p.z,p.x);
        inner.add(anchor); tag("esc",anchor); anchor.add(modelFor(sel.esc,spanFor(maxmm(sel.esc)),g=>{orientThinUp(g);seatModel(g,"base");})); rigParts.escs.push(anchor); });
    }
    const attachUsed={}; let camStack=0;
    (attachOpts||[]).forEach(o=>{ if(!(o.files&&o.files.length)) return;
      const mtype=(o.phys&&o.phys.mount_type)||"payload"; let mt=allMounts.find(m=>m.type===mtype&&!attachUsed[m.name]); let drop=0;
      if(!mt&&mtype==="camera"){ mt=allMounts.find(m=>m.type==="camera"); drop=++camStack; }
      if(!mt) mt=allMounts.find(m=>m.type==="payload"&&!attachUsed[m.name]); if(!mt) return; if(!drop) attachUsed[mt.name]=true;
      const span=spanFor(maxmm(o)); const anchor=new THREE.Group(); const p=rot(mountPos(mt)); anchor.position.copy(p); inner.add(anchor); tag(mtype,anchor);
      if(mtype==="gps"){ anchor.add(modelFor(o,span,g=>{orientThinUp(g);seatModel(g,"base");})); }
      else if(mtype==="camera"){ const th=Math.atan2(p.z,p.x); anchor.rotation.y=-th; anchor.position.x+=Math.cos(th)*span*0.6; anchor.position.z+=Math.sin(th)*span*0.6; anchor.position.y-=drop*span*0.85; anchor.add(modelFor(o,span,g=>orientCameraForward(g))); }
      else{ anchor.add(modelFor(o,span,g=>seatModel(g,"hang"))); } });
  }
  return Promise.all(ch.files.map(loadModelFile)).then(masters=>{
    const merged=new THREE.Group(); masters.forEach(mm=>merged.add(mm.clone(true)));
    if(!upAxis){ const raw=new THREE.Box3().setFromObject(merged).getSize(new THREE.Vector3()); const d3=[raw.x,raw.y,raw.z], thin=d3.indexOf(Math.min.apply(null,d3)); upAxis=thin===1?"y":thin===2?"z":"x"; }
    const q=upQuat(upAxis); merged.quaternion.copy(q); merged.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(merged); const c=box.getCenter(new THREE.Vector3()), size=box.getSize(new THREE.Vector3());
    const maxDim=Math.max(size.x,size.y,size.z)||1; inner.add(merged); inner.position.set(-c.x,-c.y,-c.z);
    chCon.scale.setScalar(chSpan/maxDim); placeMounts(q,maxDim); chCon.visible=true;
  }).catch(err=>{ console.warn("chassis load failed",err&&(err.message||err)); const q=upQuat(upAxis||"y"); const maxDim=chMaxMm/1000; chCon.scale.setScalar(chSpan/maxDim); placeMounts(q,maxDim); chCon.visible=true; });
}

// ───────── data layer: load the configured parts into opt objects ─────────
const FALLBACK = { chasis:"frame", propeller:"prop", motor:"motor", esc:"esc", battery:"battery", controller:"fc", reciever:"rx", attachments:"gimbal" };
async function loadOpt(cat, id){
  const base = `${BASE}/${cat}/${id}`;
  const spec = await fetch(`${base}/spec.json`).then(r=>r.json());
  let files=[]; if(spec.model){ const arr=Array.isArray(spec.model)?spec.model:[spec.model]; files=arr.map(f=>f.includes("/")?f:`${base}/${f}`); }
  let mounts=null; if(spec.mounts){ const mp=spec.mounts.includes("/")?spec.mounts:`${base}/${spec.mounts}`; mounts=await fetch(mp).then(r=>r.json()); }
  return { id, name:spec.name||id, catKey:cat, mass:spec.mass_g||0, qty:spec.qty||1,
           size:spec.size_mm||null, view:spec.view||null, specs:Object.entries(spec.specs||{}),
           phys:spec.physics||{}, files, mounts, fallback:{kind:FALLBACK[cat]||"none", color:0x5a6672, s:1} };
}

// ───────── camera focus targets + cinematic shot list ─────────
const V = THREE.Vector3;
function firstAnchorPos(type){ const a=ANCH[type]; if(a&&a.length){ return a[0].getWorldPosition(new V()); } return null; }
let RIG_CENTER = new V(), RIG_RADIUS = 1, DR_H = 0.3;
function targetFor(name, center){
  const map = { motor:"motor", esc:"esc", battery:"battery", fc:"flight_controller",
                controller:"flight_controller", receiver:"receiver", gps:"gps", camera:"camera" };
  if(name==="prop"){ const m=firstAnchorPos("motor"); return m?m.clone().add(new V(0,DR_H*0.25,0)):center.clone(); }
  if(name==="frame"||name==="drone") return center.clone();
  const p=firstAnchorPos(map[name]); return p?p:center.clone();
}
let SHOTS = [];
function buildShots(){
  const focus=(CFG.focus||["motor","esc","battery"]).slice();
  const C=RIG_CENTER.clone().add(new V(0,DR_H*0.15,0));
  SHOTS=[ {t:C,a0:-35,a1:15,e0:14,e1:22,d0:1.85,d1:1.45},
          {t:C,a0:15,a1:95,e0:22,e1:16,d0:1.45,d1:1.45} ];
  const sweeps=[[-120,-60,10,16],[140,100,12,18],[40,-20,30,38],[-70,-10,8,20],[60,130,16,24]];
  focus.forEach((f,i)=>{ const s=sweeps[i%sweeps.length]; const high=["battery","fc","controller","receiver","gps"].includes(f);
    SHOTS.push({t:targetFor(f,C),a0:s[0],a1:s[1],e0:s[2],e1:s[3],d0:high?1.05:0.85,d1:high?0.85:0.6}); });
  SHOTS.push({t:C,a0:-20,a1:-110,e0:18,e1:26,d0:1.45,d1:2.0});
}
function camPos(t, azDeg, elDeg, dist){ const az=azDeg*Math.PI/180, el=elDeg*Math.PI/180;
  return new V(t.x+dist*Math.cos(el)*Math.cos(az), t.z+dist*Math.sin(el), t.y+dist*Math.cos(el)*Math.sin(az)); }
const smooth = u => u*u*(3-2*u);

// ───────── overlays ─────────
const ovTitle=document.getElementById("ovTitle"), ovLabel=document.getElementById("ovLabel"), ovTable=document.getElementById("ovTable");
ovTitle.querySelector("h1").textContent = CFG.title||"Drone System";
ovTitle.querySelector("p").textContent = CFG.subtitle||"Concept Explanation";
const NICE = { motor:"Brushless Motor", prop:"Propeller", esc:"Electronic Speed Controller", battery:"LiPo Battery", fc:"Flight Controller", controller:"Flight Controller", receiver:"Radio Receiver", gps:"GPS Module", camera:"FPV Camera", frame:"Airframe", drone:"Airframe" };
let TABLE_ROWS=[], TABLE_HEAD="";
function fade(el, target){ el.style.opacity = target.toFixed(3); }
function buildTable(primaryOpt, name){
  if(!primaryOpt) return;
  TABLE_HEAD = primaryOpt.name || NICE[name] || "Specs";
  const rows=[]; (primaryOpt.specs||[]).slice(0,5).forEach(([k,v])=>rows.push([k,String(v)]));
  if(primaryOpt.size) rows.push(["Size", primaryOpt.size.map(x=>Math.round(x)).join(" × ")+" mm"]);
  if(primaryOpt.mass) rows.push(["Mass", primaryOpt.mass+" g"]);
  TABLE_ROWS=rows.slice(0,6);
  ovTable.querySelector("h2").textContent=TABLE_HEAD;
  ovTable.querySelector("table").innerHTML = TABLE_ROWS.map(r=>`<tr><td class="k">${r[0]}</td><td class="v">${r[1]}</td></tr>`).join("");
}
function winFade(t, s, e, f){ if(t<s-f||t>e+f) return 0; if(t<s) return (t-(s-f))/f; if(t>e) return 1-(t-e)/f; return 1; }

// ───────── time driver (called per frame by Playwright) ─────────
let nshot=6, seg=10;
function setTime(t){
  const idx=Math.min(SHOTS.length-1, Math.floor(t/seg)); const s=SHOTS[idx];
  const u=smooth(Math.max(0,Math.min(1,(t-idx*seg)/seg)));
  const az=s.a0+(s.a1-s.a0)*u, el=s.e0+(s.e1-s.e0)*u, dist=RIG_RADIUS*(s.d0+(s.d1-s.d0)*u);
  camera.position.copy(camPos(s.t, az, el, dist)); camera.lookAt(s.t.x, s.t.z ,s.t.y);
  camera.up.set(0,1,0); camera.lookAt(s.t);
  propGroups.forEach(p=>{ p.rotation.y = t*18*(p.userData.spinDir||1); });
  // overlays
  fade(ovTitle, winFade(t, 0.2, seg*1.6, 0.6));
  const focus=(CFG.focus||[]); let lblOp=0, lblTxt="";
  focus.forEach((f,k)=>{ const s0=(2+k)*seg, e0=(3+k)*seg; const o=winFade(t, s0+0.25, e0-0.25, 0.4); if(o>lblOp){ lblOp=o; lblTxt=NICE[f]||f; } });
  ovLabel.querySelector("span").textContent=lblTxt; fade(ovLabel, lblOp);
  fade(ovTable, TABLE_ROWS.length ? winFade(t, 2*seg+0.4, 3*seg-0.3, 0.5) : 0);
  composer.render();
}
window.__setTime = setTime;

// ───────── boot ─────────
window.__ready = (async function(){
  const [chassis, motor, prop, esc, controller, receiver, battery] = await Promise.all([
    loadOpt("chasis", CFG.chassis), loadOpt("motor", CFG.motor), loadOpt("propeller", CFG.propeller),
    loadOpt("esc", CFG.esc), loadOpt("controller", CFG.controller),
    CFG.receiver?loadOpt("reciever", CFG.receiver):Promise.resolve(null), loadOpt("battery", CFG.battery)
  ]);
  const attachOpts = await Promise.all((CFG.attachments||[]).map(a=>loadOpt("attachments", a)));
  const sel = { motor, esc, controller, reciever:receiver, battery };
  const rig = new THREE.Group(); scene.add(rig);
  await buildDroneFromMounts(rig, chassis, sel, prop, attachOpts);
  // wait for all async part models to finish loading
  for(let i=0;i<600 && __pending>0;i++){ await new Promise(r=>setTimeout(r,50)); }
  await new Promise(r=>setTimeout(r,150));
  // measure the assembled rig → frame the camera + focus targets
  rig.updateWorldMatrix(true,true);
  const box=new THREE.Box3().setFromObject(rig); const c=box.getCenter(new V()), sz=box.getSize(new V());
  // drop rig so it rests on the floor (y=0)
  rig.position.y -= box.min.y; rig.updateWorldMatrix(true,true);
  const box2=new THREE.Box3().setFromObject(rig); RIG_CENTER=box2.getCenter(new V()); DR_H=sz.y;
  RIG_RADIUS=Math.max(sz.x,sz.y,sz.z)*1.0 || 1;
  // shadow camera + key to rig scale
  key.position.set(RIG_RADIUS*1.2, RIG_RADIUS*1.8, RIG_RADIUS*0.8);
  const focusPrimary=(CFG.focus||["motor"])[0];
  const primaryMap={motor,prop,esc,battery,fc:controller,controller,receiver,gps:attachOpts.find(o=>o.id==="gps"),camera:attachOpts.find(o=>o.id==="camera"),frame:chassis};
  buildTable(primaryMap[focusPrimary]||chassis, focusPrimary);
  buildShots();
  nshot=SHOTS.length; seg=DURATION/nshot;
  setTime(0);
  window.__READY__=true;
  return true;
})();
</script>
